[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelcubed"
version = "0.1.0"
description = "Attention backend benchmarks for Qwen3-0.6B"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
flash-attn = ["flash-attn"]
flashinfer = ["flashinfer-python"]
swebench = ["swebench"]
dev = ["pytest>=8"]

[project.scripts]
kernelcubed-bench = "kernelcubed.benchmark:main"
kernelcubed-swe = "kernelcubed.swebench:main"

[tool.setuptools.packages.find]
include = ["kernelcubed*"]

[tool.setuptools.package-data]
kernelcubed = ["csrc/*.cpp", "csrc/*.cu"]
